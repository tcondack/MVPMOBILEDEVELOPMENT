components:
  schemas:
    DificuldadeEnum:
      enum:
      - Fácil
      - Médio
      - Difícil
      type: string
      description: |-
        * `Fácil` - Fácil
        * `Médio` - Médio
        * `Difícil` - Difícil
    Eventos:
      type: object
      description: Serializer para o modelo Eventos
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          maxLength: 120
        descricao:
          type: string
        data_inicio:
          type: string
          format: date-time
        data_fim:
          type: string
          format: date-time
        preco:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          nullable: true
        imagem:
          type: string
          format: uri
          nullable: true
        ativo:
          type: boolean
        parque:
          type: integer
      required:
      - data_fim
      - data_inicio
      - descricao
      - id
      - nome
      - parque
    Login:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    Novidades:
      type: object
      description: Serializer para o modelo Novidades
      properties:
        id:
          type: integer
          readOnly: true
        titulo:
          type: string
          maxLength: 150
        conteudo:
          type: string
        data_publicacao:
          type: string
          format: date-time
          readOnly: true
        ativo:
          type: boolean
        parque:
          type: integer
      required:
      - conteudo
      - data_publicacao
      - id
      - parque
      - titulo
    Parque:
      type: object
      description: Serializer para o modelo Parque
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          maxLength: 120
        descricao:
          type: string
        localizacao:
          type: string
        horario_funcionamento:
          type: string
          maxLength: 100
        taxa_entrada:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          nullable: true
        imagem:
          type: string
          format: uri
          nullable: true
        dias_funcionamento:
          type: array
          items:
            type: string
            maxLength: 20
        obs_disponibilidade:
          type: string
          nullable: true
          description: 'Ex: Fechado para manutenção nas segundas-feiras de Janeiro.'
          maxLength: 255
      required:
      - descricao
      - horario_funcionamento
      - id
      - localizacao
      - nome
    PatchedEventos:
      type: object
      description: Serializer para o modelo Eventos
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          maxLength: 120
        descricao:
          type: string
        data_inicio:
          type: string
          format: date-time
        data_fim:
          type: string
          format: date-time
        preco:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          nullable: true
        imagem:
          type: string
          format: uri
          nullable: true
        ativo:
          type: boolean
        parque:
          type: integer
    PatchedNovidades:
      type: object
      description: Serializer para o modelo Novidades
      properties:
        id:
          type: integer
          readOnly: true
        titulo:
          type: string
          maxLength: 150
        conteudo:
          type: string
        data_publicacao:
          type: string
          format: date-time
          readOnly: true
        ativo:
          type: boolean
        parque:
          type: integer
    PatchedParque:
      type: object
      description: Serializer para o modelo Parque
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          maxLength: 120
        descricao:
          type: string
        localizacao:
          type: string
        horario_funcionamento:
          type: string
          maxLength: 100
        taxa_entrada:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          nullable: true
        imagem:
          type: string
          format: uri
          nullable: true
        dias_funcionamento:
          type: array
          items:
            type: string
            maxLength: 20
        obs_disponibilidade:
          type: string
          nullable: true
          description: 'Ex: Fechado para manutenção nas segundas-feiras de Janeiro.'
          maxLength: 255
    PatchedTrilhas:
      type: object
      description: Serializer para o modelo Trilhas
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          maxLength: 120
        descricao:
          type: string
        dificuldade:
          $ref: '#/components/schemas/DificuldadeEnum'
        distancia:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        imagem:
          type: string
          format: uri
          nullable: true
        aviso_disponibilidade:
          type: string
          nullable: true
          maxLength: 255
        ativo:
          type: boolean
        parque:
          type: integer
    Trilhas:
      type: object
      description: Serializer para o modelo Trilhas
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          maxLength: 120
        descricao:
          type: string
        dificuldade:
          $ref: '#/components/schemas/DificuldadeEnum'
        distancia:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        imagem:
          type: string
          format: uri
          nullable: true
        aviso_disponibilidade:
          type: string
          nullable: true
          maxLength: 255
        ativo:
          type: boolean
        parque:
          type: integer
      required:
      - descricao
      - dificuldade
      - distancia
      - id
      - nome
      - parque
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
