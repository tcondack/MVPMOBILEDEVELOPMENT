openapi: 3.0.3
info:
  title: Minha API Django
  version: 1.0.0
  description: Documentação completa dos endpoints da aplicação.
paths:
  /api/eventos/:
    get:
      operationId: eventos_list
      tags:
      - eventos
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Eventos'
          description: ''
    post:
      operationId: eventos_create
      tags:
      - eventos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Eventos'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Eventos'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Eventos'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Eventos'
          description: ''
  /api/eventos/{id}/:
    get:
      operationId: eventos_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Evento.
        required: true
      tags:
      - eventos
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Eventos'
          description: ''
    put:
      operationId: eventos_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Evento.
        required: true
      tags:
      - eventos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Eventos'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Eventos'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Eventos'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Eventos'
          description: ''
    patch:
      operationId: eventos_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Evento.
        required: true
      tags:
      - eventos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEventos'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedEventos'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedEventos'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Eventos'
          description: ''
    delete:
      operationId: eventos_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Evento.
        required: true
      tags:
      - eventos
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/login/:
    post:
      operationId: login_create
      description: Autentica os administradores do Circuito Terê Verde.
      tags:
      - login
      requestBody:
